# =============================================================================
# Render Blueprint - WatchDogs Security City (16 OSINT agents)
# Deploy: connect the GitHub repo; Render reads this file.
#
# SECRETS are never stored here. Every `sync: false` variable must be set by hand in the Render
# dashboard (Environment). The app REFUSES TO START without ADMIN_PASSWORD and FLASK_SECRET_KEY, so a
# deploy can never come up open: if a variable is missing the deploy fails its health check and
# Render keeps the previous version running.
# =============================================================================

services:
  - type: web
    name: watchdogs-security-city
    runtime: docker
    repo: https://github.com/infantesromeroadrian/WatchDogs-Security-City
    plan: free
    region: frankfurt  # EU - closest to Spain

    # gunicorn flags live in the Dockerfile CMD (1 worker x 4 threads, --preload, --max-requests 50)
    healthCheckPath: /api/health

    envVars:
      # --- Secrets (set in the dashboard; never commit) ---
      - key: OPENAI_API_KEY      # provider key (Groq by default)
        sync: false
      - key: ADMIN_USERNAME      # login for the web app and the API
        sync: false
      - key: ADMIN_PASSWORD      # >= 12 chars, upper + lower + digit
        sync: false
      - key: FLASK_SECRET_KEY    # signs session tokens
        generateValue: true
      - key: MAP_BOX_ACCESS_TOKEN  # optional; use a URL-restricted public token
        sync: false

      # --- LLM backend: one provider, one default model (see README) ---
      - key: LLM_PROVIDER
        value: groq
      - key: OPENAI_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: AGENT_TIMEOUT_SECONDS   # must stay below gunicorn --timeout (300)
        value: "180"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"

      # --- Hard limits protecting the provider key ---
      - key: LLM_DAILY_CALL_LIMIT          # a full analysis = 16 calls per frame
        value: "480"
      - key: LLM_DAILY_CALL_LIMIT_PER_USER
        value: "320"
      - key: MAX_VIDEO_SIZE_MB
        value: "50"
      - key: VIDEO_RETENTION_MINUTES
        value: "15"

      # --- Runtime ---
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: TRUST_PROXY       # Render terminates TLS: honour X-Forwarded-*
        value: "1"
      - key: MALLOC_ARENA_MAX  # keeps RSS ~200 MB under 4 concurrent analyses (512 MB plan)
        value: "2"
      - key: PYTHONPATH
        value: /app
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
